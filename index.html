<html lang="en">
<head>

<title>Q8 Belt Temperature Calculator · ALC SKICORP for Ortholite</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.gate{position:fixed;inset:0;z-index:50;background:var(--navy);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-left,0px))}
.gate[hidden]{display:none!important}
.gate .card{background:var(--paper);color:var(--ink);width:min(440px,100%);padding:28px 26px;border-top:5px solid var(--ember)}
.gate .logos{margin-bottom:18px}
.gate h2{font-family:var(--disp);font-size:26px;margin:0 0 4px;color:var(--ink)}
.gate p{font-size:13px;color:var(--ink-2);margin:0 0 16px}
.gate form{display:grid;grid-template-columns:1fr auto;gap:10px}
.gate input{font-family:var(--mono);font-size:18px;letter-spacing:.12em;text-transform:uppercase;padding:10px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.gate button{font-family:var(--sans);font-weight:600;background:var(--ember);color:#172238;border:0;padding:10px 18px;cursor:pointer}
.gate .err{color:var(--bad);font-size:13px;margin:10px 0 0;min-height:1.2em}
.gate .fine{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:16px}
.logos{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fff;padding:10px 14px;width:fit-content;max-width:100%;margin-bottom:14px}
.logos .lg{height:52px;width:auto;max-width:100%}
.logos .lg-o{height:34px}
.logos .made{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7a8296}
/* Layout: control panel left (inputs + reference run), reading panel right (set-point + diagnostics), speed ladder below. Navy + ember to match the briefing deck. */
:root{
  --bg:#f3f1ec; --paper:#ffffff; --ink:#172238; --ink-2:#4a5468; --ink-3:#7a8296;
  --line:#d9d5cc; --navy:#172238; --navy-2:#243356; --ember:#e58a2b; --ember-ink:#b8661a;
  --ok:#3f8a46; --ok-bg:#e7f2e6; --warn:#c7791b; --warn-bg:#fbefdc; --bad:#c23b3b; --bad-bg:#f9e3e3;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --disp:"Fraunces","Iowan Old Style",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151f; --paper:#1a2130; --ink:#eef0f4; --ink-2:#b4bccb; --ink-3:#7f889b;
  --line:#2c3547; --navy:#0d1322; --navy-2:#1c2740; --ember:#f09a3c; --ember-ink:#f3ad62;
  --ok:#6fc27a; --ok-bg:#1c2e1f; --warn:#e8a650; --warn-bg:#332816; --bad:#ef6b6b; --bad-bg:#3a1c1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151f; --paper:#1a2130; --ink:#eef0f4; --ink-2:#b4bccb; --ink-3:#7f889b;
  --line:#2c3547; --navy:#0d1322; --navy-2:#1c2740; --ember:#f09a3c; --ember-ink:#f3ad62;
  --ok:#6fc27a; --ok-bg:#1c2e1f; --warn:#e8a650; --warn-bg:#332816; --bad:#ef6b6b; --bad-bg:#3a1c1c; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--navy);color:#fff;border-bottom:4px solid var(--ember)}
header.top .wrap{padding-block:26px 22px;display:flex;flex-wrap:wrap;gap:18px 32px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ember)}
h1{font-family:var(--disp);font-weight:700;font-size:clamp(28px,4vw,40px);line-height:1.05;margin:6px 0 4px;text-wrap:balance;color:#fff}
.sub{color:#c9d0de;font-size:14px;margin:0}
.docctl{font-family:var(--mono);font-size:11px;color:#c9d0de;display:grid;grid-template-columns:auto auto;gap:2px 14px;border:1px solid #3a4866;padding:10px 14px}
.docctl b{color:#fff;font-weight:500}

main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px;margin-top:26px}
@media (max-width:820px){main{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--line);min-width:0}
.panel h2{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:0;padding:12px 18px;border-bottom:1px solid var(--line)}
.panel .body{padding:18px}

.field{display:grid;gap:6px;margin-bottom:18px}
.field label{font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:baseline}
.field label span.u{font-family:var(--mono);font-weight:400;font-size:12px;color:var(--ink-3)}
.inrow{display:grid;grid-template-columns:1fr 112px;gap:12px;align-items:center}
input[type=range]{width:100%;accent-color:var(--ember);min-width:0}
input[type=number]{font-family:var(--mono);font-size:16px;padding:8px 10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;border-radius:2px}
input:focus-visible,button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.hint{font-size:12px;color:var(--ink-3)}
.toggle{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);background:var(--bg)}
.toggle input{margin-top:3px;accent-color:var(--ember)}
.toggle b{display:block;font-size:14px}
.toggle small{color:var(--ink-2);font-size:12px}

.ref{margin-top:20px;border:1px solid var(--ember);padding:14px;background:var(--bg)}
.ref .eyebrow{margin-bottom:4px}
.ref p{margin:0 0 12px;font-size:12px;color:var(--ink-2)}
.ref .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ref .grid label{display:grid;gap:4px;font-size:11px;font-family:var(--mono);color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.ref .grid input{font-size:15px;padding:7px 8px}
.ref .fit{margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--ink-2)}

.fixed{margin-top:18px;border-top:1px dashed var(--line);padding-top:14px}
.fixed dl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:0;font-size:13px}
.fixed dt{color:var(--ink-2)}
.fixed dd{margin:0;font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}

.result{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:520px){.result{grid-template-columns:1fr}}
.big{padding:22px 18px;border-right:1px solid var(--line)}
@media (max-width:520px){.big{border-right:0;border-bottom:1px solid var(--line)}}
.big .lab{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.big .num{font-family:var(--disp);font-weight:700;font-size:clamp(56px,9vw,84px);line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums;color:var(--ink)}
.big .num small{font-size:.38em;font-weight:500;color:var(--ink-2);margin-left:4px}
.big .setline{font-size:13px;color:var(--ink-2)}
.status{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;padding:5px 10px;margin-top:12px;border-left:4px solid}
.status.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.status.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.status.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.diag{padding:16px 18px;display:grid;gap:10px;align-content:start}
.kv{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px}
.kv:last-child{border-bottom:0}
.kv .k{font-size:13px;color:var(--ink-2)}
.kv .k small{display:block;color:var(--ink-3);font-size:11px}
.kv .v{font-family:var(--mono);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv .v.c-ok{color:var(--ok)} .kv .v.c-warn{color:var(--warn)} .kv .v.c-bad{color:var(--bad)}

.advice{margin:0;padding:14px 18px;border-top:1px solid var(--line);font-size:14px;line-height:1.55}
.advice b{color:var(--ember-ink)}

.ladder{margin-top:22px}
.ladder .scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:600px}
th,td{padding:9px 12px;text-align:right;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
th:first-child,td:first-child{text-align:left}
td.mono{font-family:var(--mono)}
tr.cur td{background:var(--bg);font-weight:600}
.pill{display:inline-block;padding:2px 8px;font-family:var(--mono);font-size:11px;font-weight:600;border-left:3px solid}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}

.formula{margin-top:22px;padding:16px 18px;background:var(--navy-2);color:#fff;border-left:4px solid var(--ember)}
.formula .eyebrow{margin-bottom:6px}
.formula code{font-family:var(--mono);font-size:14px;display:block;color:#fff;word-break:break-word}
.formula p{margin:8px 0 0;font-size:12px;color:#c9d0de;max-width:72ch}
.formula p b{color:#fff;font-weight:600}
footer{margin-top:26px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:12px;display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between}
</style>
</head>

var g=document.getElementById('gate'),f=document.getElementById('gform'),i=document.getElementById('gcode'),e=document.getElementById('gerr'),app=document.getElementById('app');
var b=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
function norm(s){return s.toUpperCase().replace(/[^A-Z0-9]/g,'')}
async function unlock(code){var raw=new TextEncoder().encode(norm(code));var base=await crypto.subtle.importKey('raw',raw,'PBKDF2',false,['deriveKey']);
for(var k=0;k<ENC.wraps.length;k++){var w=ENC.wraps[k];try{var wk=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(w.s),iterations:150000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);var K=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(w.i)},wk,b(w.c));var dk=await crypto.subtle.importKey('raw',K,'AES-GCM',false,['decrypt']);var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(ENC.iv)},dk,b(ENC.ct));return JSON.parse(new TextDecoder().decode(pt));}catch(x){}}return null;}
function mount(p){app.innerHTML=p.html;var gl=g.querySelectorAll('img.lg');app.querySelectorAll('img[data-logo]').forEach(function(im){im.src=(im.dataset.logo==='alc'?gl[0]:gl[1]).src;});var s=document.createElement('script');s.textContent=p.js;document.body.appendChild(s);g.hidden=true;}
async function tryCode(code,remember){var p=await unlock(code);if(p){if(remember){try{localStorage.setItem('astpl-q8-code',norm(code));}catch(x){}}mount(p);return true;}return false;}
